<svg baseProfile="full" height="250px" width="800px"
     xmlns="http://www.w3.org/2000/svg">
  <rect fill="#000000" width="100%" height="100%" />
  <text fill="lime" font-family="monospace" font-size="18px" x="20" y="50">
    alex@shroomtop:~$ whoami
  </text>
  <text fill="white" font-family="monospace" font-size="18px" x="20" y="80">
    alex
  </text>
  <text fill="lime" font-family="monospace" font-size="18px" x="20" y="120">
    alex@shroomtop:~$ uptime
  </text>
  <text fill="white" font-family="monospace" font-size="18px" x="20" y="150">
    2 years active - sober, focused, unstoppable
  </text>
  <text fill="lime" font-family="monospace" font-size="18px" x="320" y="150">
    |
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
